services:
  sos-server:
    build: .
    container_name: sos-call-server
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./data:/app/data
    environment:
      - SERVER_PORT=9090
      - JWT_SECRET=change-me-to-a-random-string
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
